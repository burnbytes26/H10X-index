name: tests

on:
  push:
  pull_request:

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # forge-std is fetched from GitHub; use HTTPS instead of SSH on the runner
      - run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - run: npm ci

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Build
        run: forge build

      - name: Test
        run: forge test
